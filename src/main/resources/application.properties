server.port=${PORT:8080}
spring.application.name=inventory-management
logging.level.com.warehouse=INFO

# MySQL connection (override credentials and host with environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:inventory_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:inventory}
spring.datasource.password=${DB_PASSWORD:inventory}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Session authentication and browser security
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
app.auth.admin.username=${ADMIN_USERNAME:admin}
app.auth.admin.password=${ADMIN_PASSWORD}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
